name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Missing required secrets: SUPABASE_URL and/or SUPABASE_ANON_KEY" >&2
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Inject Supabase config (Attendance Tracker)
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          supabase_url = os.environ.get('SUPABASE_URL', '').strip()
          anon_key = os.environ.get('SUPABASE_ANON_KEY', '').strip()

          p = Path('attendance-hours/config.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('__SUPABASE_URL__', supabase_url)
          s = s.replace('__SUPABASE_ANON_KEY__', anon_key)
          p.write_text(s, encoding='utf-8')
          print('Injected Supabase config into', p)
          PY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
