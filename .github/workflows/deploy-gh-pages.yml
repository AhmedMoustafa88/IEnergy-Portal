name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Missing required secrets: SUPABASE_URL and/or SUPABASE_ANON_KEY" >&2
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Inject Supabase config (Attendance Tracker)
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          supabase_url = os.environ.get('SUPABASE_URL', '').strip()
          anon_key = os.environ.get('SUPABASE_ANON_KEY', '').strip()

          # Support both repo layouts:
          # 1) attendance-hours/... at repo root
          # 2) IEnergy-Portal-main/attendance-hours/... (if the project folder was committed)
          candidates = [
            Path('attendance-hours/config.js'),
            Path('IEnergy-Portal-main/attendance-hours/config.js'),
          ]
          paths = [p for p in candidates if p.exists()]
          if not paths:
            raise SystemExit('Could not find attendance-hours/config.js to inject secrets into.')

          for p in paths:
            s = p.read_text(encoding='utf-8')
            s = s.replace('__SUPABASE_URL__', supabase_url)
            s = s.replace('__SUPABASE_ANON_KEY__', anon_key)
            p.write_text(s, encoding='utf-8')
            print('Injected Supabase config into', p)
          PY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Setup Node (for Leave Manager build)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Leave Manager dependencies
        working-directory: apps/leave-manager/frontend
        run: npm install

      - name: Build Leave Manager
        working-directory: apps/leave-manager/frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Assemble site folder
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site

          # Copy portal static files (exclude dev-only folders)
          rsync -av             --exclude '.github'             --exclude '_site'             --exclude 'apps'             ./ _site/

          # Add Leave Manager build output under /leave-manager/
          rm -rf _site/leave-manager
          mkdir -p _site/leave-manager
          rsync -av apps/leave-manager/frontend/dist/ _site/leave-manager/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
